<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ustrzel Pike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a1526;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,17,34,.55);backdrop-filter:blur(6px)}
.hidden{display:none!important}
#title{font-size:68px;font-weight:900;color:#fff;letter-spacing:3px;text-shadow:0 2px 0 #7fb2e8,0 5px 0 rgba(25,55,105,.55),0 14px 34px rgba(0,0,0,.6);transform:rotate(-2deg)}
.ctrl{color:#dcecff;font-size:17px;text-align:center;line-height:1.6;opacity:.92;margin-top:8px}
#levels{display:flex;gap:14px;margin-top:14px}
.lv{width:80px;padding:10px 0;border:none;border-radius:12px;background:linear-gradient(180deg,#eef7ff,#bcd9f5);color:#1b3a63;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #7fa9d6,0 12px 24px rgba(0,0,0,.35);transition:transform .1s}
.lv:hover{transform:translateY(-3px)}
.lv.locked{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.lv .num{font-size:27px;line-height:1}
.lv .stars{font-size:14px;color:#f5a623;letter-spacing:2px}
.btnrow{display:flex;gap:14px;margin-top:8px}
.act{border:none;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#5aa9e6,#2f6fc4);box-shadow:0 6px 0 #1d4a8a,0 12px 24px rgba(0,0,0,.35);cursor:pointer}
.act:hover{filter:brightness(1.12)}
.big{font-size:46px;font-weight:900;color:#fff;line-height:1.3;text-shadow:0 3px 0 #7fb2e8,0 10px 26px rgba(0,0,0,.5);text-align:center}
.starrow{font-size:64px;letter-spacing:12px;color:#f5a623;text-shadow:0 4px 0 #9c6b00,0 8px 22px rgba(0,0,0,.4);min-height:76px}
@keyframes starpop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:starpop .5s ease}
.scoreline{color:#dcecff;font-size:20px;text-align:center;line-height:1.6}
#muteBtn{position:absolute;left:12px;bottom:12px;z-index:9;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;font-size:18px;padding:5px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>

<div id="menu" class="ovl">
 <div id="title">USTRZEL PIKE</div>
 <div class="ctrl">🖱️ Przeciągnij śnieżkę i puść, aby wystrzelić</div>
 <div class="ctrl" style="font-size:14px;opacity:.85">🎯 Liczą się trafienia <b>W GŁOWĘ</b>.<br>porywy wiatru zmieniają tor lotu.</div>
 <div id="levels"></div>
</div>

<div id="endOvl" class="ovl hidden">
 <div class="big" id="endTitle"></div>
 <div id="endStars" class="starrow"></div>
 <div class="scoreline" id="endScore"></div>
 <div class="btnrow">
  <button class="act" id="btnRetry">Jeszcze raz</button>
  <button class="act" id="btnNext">Następny level ▸</button>
  <button class="act" id="btnMenu1">Do menu</button>
 </div>
</div>

<div id="finalOvl" class="ovl hidden">
 <div class="big">SEZON ZAKOŃCZONY! ❄️<br><span style="font-size:24px;font-weight:600">Pika wrócił do piwnicy.</span></div>
 <div id="finalStars" class="starrow"></div>
 <div class="scoreline" id="finalScore"></div>
 <div class="btnrow"><button class="act" id="btnFinalMenu">Do menu</button><button class="act" id="btnAgain">Zagraj od nowa</button></div>
</div>

<button id="muteBtn">🔊</button>
</div>
<script>
"use strict";
const W=1280,H=720,GROUND_Y=636,GRAV=1550,K=11.5,MAXPULL=115,TAU=Math.PI*2;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;const s=Math.min(innerWidth/W,innerHeight/H)*.98;cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rand(a=1,b){return b===undefined?Math.random()*a:a+Math.random()*(b-a);}
function rr(c,x,y,w,h,r){
 w=Math.max(0,w);h=Math.max(0,h);
 if(w===0||h===0){c.beginPath();return;}
 r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
const LEVELS=[
 {name:"Pierwszy zjebany mix",balls:4,need:2,speed:70,wind:1.6,react:.55,dpb:1,cd:1.8,kb:[16,24],blink:false,
  hint:"",
  obs:[{t:'mound',x:620,w:95,h:30}]},
 {name:"Narodziny laserów",balls:5,need:2,speed:95,wind:2.8,react:.5,dpb:2,cd:1.7,kb:[13,20],blink:false,
  hint:"",
  obs:[{t:'ice',x:400,w:34,h:96},{t:'mound',x:645,w:88,h:34}]},
 {name:"Odkrycie soundgoodizera",balls:5,need:3,speed:118,wind:3.6,react:.45,dpb:2,cd:1.6,kb:[11,17],blink:false,
  hint:"",
  obs:[{t:'mound',x:600,w:92,h:42},{t:'slider',cx:800,amp:130,w:56,h:46,p:5.4}]},
 {name:"0 wyświetleń na soundcludzie",balls:6,need:3,speed:140,wind:4.4,react:.4,dpb:3,cd:1.45,kb:[9,14],blink:true,
  hint:"",
  obs:[{t:'ice',x:400,w:36,h:88},{t:'mound',x:620,w:95,h:38},{t:'pine',x:975,s:1.2}]},
 {name:"Powrót laserów",balls:6,need:4,speed:158,wind:5.4,react:.33,dpb:3,cd:1.3,kb:[8,12],blink:true,
  hint:"",
  obs:[{t:'ice',x:330,w:38,h:104},{t:'mound',x:615,w:98,h:44},{t:'slider',cx:790,amp:120,w:58,h:48,p:5.8},{t:'pine',x:985,s:1.3}]}
];
const COMMENTS=["stopa nachodzi na werbel","dodam trochę soundgoodizera","od jutra zaczynam znowu grzebać w produkcji","tak sie bawi wawka","korpo life z anetkami z HRu","zgniłem xD","średnio siedzi ten mix","dajmy lasery","haty kłują w ucho","xD","jebane b2b","oj tak +1 byczq","skrillix to peak muzyki elektronicznej","anetka ma dziś sandałki","bitkonia za wcześnie sprzedauem","jebaniutki","źródełko łatwego hajsu w korpo wysycha","ah anoni","musi być szeroko na panoramie","po tylu latach nadal buja"];
const REACTIONS=["NIE W SZCZEPIONKE","BAS MASUJE","MUSI BYĆ PHAAAAT","Muszę łapać ślinę tych śmieci ❄️","xD","JARAM SKUNA"];
// reakcje po utracie czapki (pierwsze trafienie w głowę)
const HATREACTIONS=["+15 dB","Znowu zgubiłem jarmułke","Gdzie moja jarmułka"];
// ---------- DŹWIĘK (WebAudio, bez plików) ----------
const Snd={ctx:null,master:null,muted:false,
init(){if(this.ctx)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.5;this.master.connect(this.ctx.destination);},
resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
tone(f0,f1,dur,type,vol,when){if(!this.ctx)return;const t=this.ctx.currentTime+(when||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(28,f0),t);o.frequency.exponentialRampToValueAtTime(Math.max(24,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.03);},
noise(dur,vol,fc){if(!this.ctx)return;const n=Math.max(64,Math.floor(this.ctx.sampleRate*dur));const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start();},
whoosh(){this.noise(.3,.2,700);},puff(){this.noise(.14,.16,380);},click(){this.tone(660,520,.07,'triangle',.2);},
crunch(){this.noise(.18,.28,900);this.tone(140,70,.14,'sine',.18);},
iceHit(){this.tone(1180,760,.1,'sine',.3);this.tone(1560,1100,.09,'triangle',.12,.02);},
blinkSfx(){this.tone(940,260,.18,'sine',.3);this.noise(.16,.18,1900);},
blockedSfx(){this.tone(520,340,.16,'sine',.28);this.noise(.1,.12,2400);},
hitSound(){const v=Math.floor(rand(4));if(v===0){this.tone(340,75,.4,'triangle',.5);this.tone(680,150,.3,'sine',.18);}else if(v===1){this.tone(196,185,.12,'square',.22);this.tone(196,178,.14,'square',.22,.18);}else if(v===2){this.tone(230,95,.22,'sine',.4);this.tone(165,70,.3,'sine',.4,.2);}else{this.tone(520,140,.18,'sine',.42);this.noise(.08,.15,1400);}},
winJingle(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,f*.99,.2,'triangle',.3,i*.1));},
loseTune(){[330,262,196].forEach((f,i)=>this.tone(f,f*.87,.32,'sawtooth',.14,i*.17));}
};
// ---------- PLIKI MP3 KLAWIATURY PIKI (ten sam katalog co index.html) ----------
const KBNAMES=['1.mp3','2.mp3','3.mp3'];
const KBDUR=[2.73,2.783,4.689];
let kbAud=[null,null,null];
function kbAudio(i){if(!kbAud[i]){const a=new Audio(KBNAMES[i-1]);a.preload='auto';a.volume=Snd.muted?0:.5;kbAud[i]=a;}return kbAud[i];}
// ---------- POSTĘP (TYLKO W TRAKCIE SESJI) ----------
// Trwałe zapisywanie usunięte: bez localStorage. Po zamknięciu karty/przeglądarki i ponownym otwarciu
// odblokowany jest znowu tylko level 1 — poniższy stan żyje wyłącznie do odświeżenia strony.
let save={unlocked:1,stars:[0,0,0,0,0]};
// ---------- STAN GRY ----------
let state='MENU',levelIdx=0,score=0,totalScore=0,gt=0,lastTs=0,shakeTrauma=0;
let winTimer=-1,loseTimer=-1,bannerT=0;
const POUCH={x:169,y:502};
const pika={x:1050,y:GROUND_Y,vx:0,vy:0,dir:-1,phase:0,stunT:0,crouchT:0,ce:1,wa:1,dodgeCd:.8,pauseT:0,hits:0,defeated:false,landed:false,rot:0,kb:null,plan:null,kbNext:99,hatLost:false};
let headPos={x:pika.x,y:pika.y-96};
let ball=null;
function newBall(){ball={x:POUCH.x,y:POUCH.y,vx:0,vy:0,r:13,phase:'ready',t:0,hitsInFlight:0,lastHit:-9,spawnAt:gt,squash:0,dodgesUsed:0};}
let ballsLeft=0,shotsFired=0,aiming=false;
let wind=0,windTarget=0,windTimer=0;
function maxWindA(){return LEVELS[levelIdx].wind*78;}
// ---------- PORYWY WIATRU ----------
const gust={on:false,t:0,dur:1,amt:0,next:6};
function curWind(){let w=wind;if(gust.on){const pr=clamp((gust.dur-gust.t)/gust.dur,0,1);w+=gust.amt*Math.sin(Math.PI*pr);}return w;}
// ---------- PRZESZKODY ----------
let obstacles=[];
function buildObs(){obstacles=LEVELS[levelIdx].obs.map(o=>{const q=Object.assign({},o);if(q.t==='slider')q.ph=rand(TAU);return q;});}
function sliderX(o){return o.cx+Math.cos(gt*TAU/o.p+o.ph)*o.amp;}
// zwraca 'ice' | 'shatter' | null — czy i od czego śnieżka (x,y,r) kolizuje z przeszkodą
function obsHit(x,y,r,forIce){
 for(const o of obstacles){
  if(o.t==='mound'){const dx=x-o.x;if(Math.abs(dx)<o.w){const sy=GROUND_Y-o.h*Math.sqrt(1-(dx*dx)/(o.w*o.w));if(y+r>sy&&y<GROUND_Y+2)return'shatter';}}
  else if(o.t==='ice'){const top=GROUND_Y-o.h,hw=o.w/2;if(x+r>o.x-hw&&x-r<o.x+hw&&y+r>top&&y<GROUND_Y){if(!forIce)return'ice';}}
  else if(o.t==='slider'){const sx=sliderX(o),hw=o.w/2,top=GROUND_Y-o.h;if(x+r>sx-hw&&x-r<sx+hw&&y+r>top&&y<GROUND_Y+2)return'shatter';}
  else if(o.t==='pine'){if(Math.abs(x-o.x)<16*o.s&&y>GROUND_Y-98*o.s&&y<GROUND_Y+4)return'shatter';}
 }return null;}
// ---------- BĄBELKI Z KOMENTARZAMI PIKI ----------
const bubble={text:'',t:0,showing:false,kind:'talk',nextIn:5};
function sayReact(txt){bubble.text=txt;bubble.kind='react';bubble.t=0;bubble.showing=true;}
// ---------- CZĄSTECZKI I OTOCZENIE ----------
let parts=[],texts=[];
const flakes=Array.from({length:130},()=>({x:rand(W),y:rand(H),z:rand(.4,1)}));
const clouds=[{x:120,y:90,s:1.1},{x:480,y:60,s:.8},{x:820,y:130,s:1.3},{x:1150,y:70,s:.7}];
// ---------- RYSOWANIE ŚWIATA ----------
let faceReady=false;const faceImg=new Image();faceImg.onload=()=>{faceReady=true;};faceImg.onerror=()=>{};
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6fa8dc');g.addColorStop(.75,'#cfe9fb');g.addColorStop(1,'#e6f4fd');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
 const sg=ctx.createRadialGradient(1080,120,10,1080,120,95);sg.addColorStop(0,'rgba(255,246,207,.95)');sg.addColorStop(.35,'rgba(255,246,207,.5)');sg.addColorStop(1,'rgba(255,246,207,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(1080,120,95,0,TAU);ctx.fill();
 ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(1080,120,42,0,TAU);ctx.fill();}
function cloudDraw(x,y,s){ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#fff';[[0,0,26],[34,-10,22],[66,2,25],[-30,4,20]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0]*s,y+p[1]*s,p[2]*s,0,TAU);ctx.fill();});ctx.restore();}
function drawClouds(){for(const c of clouds)cloudDraw(c.x,c.y,c.s);}
function drawPine(x,gy,s,color){const h=100*s,w2=46*s;
 // RUCHOME IGŁAKI: pochylone w stronę aktualnego wiatru + delikatne kiwanie podczas porywu.
 let leanA=clamp(wind*.0006,-.2,.2);
 if(gust.on){const env=Math.sin(Math.PI*clamp((gust.dur-gust.t)/gust.dur,0,1));leanA+=env*Math.sin(gt*8+x*.13)*.05;}
 ctx.save();ctx.translate(x,gy);ctx.rotate(leanA); // obrot wokół bazy pnia (korzenie w ziemi)
 ctx.fillStyle='#6b4a2c';ctx.fillRect(-5*s,-4*s,10*s,8*s);
 const tri=(ay,hw,by,c)=>{ctx.fillStyle=c||color;ctx.beginPath();ctx.moveTo(0,ay);ctx.lineTo(-hw,by);ctx.lineTo(hw,by);ctx.closePath();ctx.fill();};
 tri(-.55*h,.5*w2,0,color);tri(-.78*h,.38*w2,-.32*h,color);tri(-h,.26*w2,-.64*h,color);
 if(color==='#4f7d68')tri(-h,.13*w2,-.9*h,'#fff');
 ctx.restore();}
function drawBackdrop(){
 ctx.fillStyle='#d7e9f8';ctx.beginPath();ctx.moveTo(-20,GROUND_Y);[[0,560],[150,432],[300,520],[470,392],[640,515],[820,418],[1000,505],[1160,438],[1280,500]].forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W+20,GROUND_Y);ctx.closePath();ctx.fill();
 ctx.fillStyle='#b9d2ea';for(let i=0;i<14;i++)drawPine((i*97+30)%W,GROUND_Y-6,.5+(i%2)*.08,'#b9d2ea');
 const near=[[40,1.0],[120,.8],[215,1.15],[330,.75],[455,1.0],[560,.9],[1215,.85],[1265,1.1]];
 for(const n of near)drawPine(n[0],GROUND_Y+8,n[1],'#4f7d68');}
function drawGround(){const g=ctx.createLinearGradient(0,GROUND_Y,0,H);g.addColorStop(0,'#f6fbff');g.addColorStop(1,'#d3e2f0');ctx.fillStyle=g;ctx.fillRect(-20,GROUND_Y,W+40,H-GROUND_Y+20);
 ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<6;i++){const x=(i*230+80)%W;ctx.beginPath();ctx.ellipse(x,GROUND_Y+14,90,12,0,Math.PI,TAU);ctx.fill();}
 for(let i=0;i<26;i++){const x=(i*173+40)%W,y=GROUND_Y+18+(i*97)%(H-GROUND_Y-28),tw=.5+.5*Math.sin(gt*2+i*1.7);ctx.globalAlpha=Math.max(.1,tw)*.8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,1.6,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;}
function drawSnowman(){const x=76,y=GROUND_Y;ctx.save();
 ctx.fillStyle='rgba(140,170,205,.3)';ctx.beginPath();ctx.ellipse(x,y+8,40,9,0,0,TAU);ctx.fill();
 const sph=(cy,r)=>{const g=ctx.createRadialGradient(x-r*.3,cy-r*.35,r*.15,x,cy,r);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#dbe7f3');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,cy,r,0,TAU);ctx.fill();};
 sph(y-32,32);sph(y-64,22);
 ctx.strokeStyle='#5a4630';ctx.lineWidth=3.5;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x+18,y-70);ctx.lineTo(x+46,y-92);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x-18,y-70);ctx.lineTo(x-44,y-88);ctx.stroke();
 ctx.fillStyle='#e2574c';rr(ctx,x-20,y-49,40,7,3);ctx.fill();
 ctx.fillStyle='#2a3550';ctx.beginPath();ctx.arc(x-7,y-66,2.2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x+7,y-66,2.2,0,TAU);ctx.fill();
 ctx.fillStyle='#f59b3c';ctx.beginPath();ctx.moveTo(x+2,y-58);ctx.lineTo(x+19,y-56);ctx.lineTo(x+2,y-53);ctx.closePath();ctx.fill();
 ctx.fillStyle='#5a4630';rr(ctx,x-21,y-91,42,5,2);ctx.fill();rr(ctx,x-13,y-108,26,19,5);ctx.fill();
 ctx.restore();}
// ---------- PRZESZKODY (rysowanie) ----------
function drawMound(o){const x=o.x,w=o.w,h=o.h;
 ctx.fillStyle='rgba(140,170,205,.3)';ctx.beginPath();ctx.ellipse(x,GROUND_Y+6,w*1.05,9,0,0,TAU);ctx.fill();
 const g=ctx.createLinearGradient(0,GROUND_Y-h,0,GROUND_Y+4);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#dceaf7');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w,GROUND_Y+2);ctx.quadraticCurveTo(x-w*.6,GROUND_Y-h*1.15,x,GROUND_Y-h);ctx.quadraticCurveTo(x+w*.6,GROUND_Y-h*1.15,x+w,GROUND_Y+2);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(170,200,230,.8)';ctx.lineWidth=2;ctx.stroke();
 for(let i=0;i<4;i++){const dx=x-w*.6+i*w*.4,tw=.5+.5*Math.sin(gt*2.4+i);ctx.globalAlpha=.4+tw*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-dx+w*.1,GROUND_Y-h*.5-i%3*7,1.8,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;}
function drawIce(o){const x=o.x,w=o.w,h=o.h,top=GROUND_Y-h;
 const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'rgba(215,245,255,.92)');g.addColorStop(.5,'rgba(168,224,250,.75)');g.addColorStop(1,'rgba(223,250,255,.9)');
 ctx.fillStyle=g;rr(ctx,x-w/2,top,w,h+6,6);ctx.fill();
 ctx.strokeStyle='rgba(120,200,240,.85)';ctx.lineWidth=2.5;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-w/2+6,top+10);ctx.lineTo(x-w/2+6,GROUND_Y-8);ctx.stroke();
 const sh=(gt*40)%h;ctx.save();rr(ctx,x-w/2+3,top,w-6,h,4);ctx.clip();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();const yy=top+((sh)%(h-14))+7;ctx.moveTo(x-w/2,yy);ctx.lineTo(x+w/2,yy-10);ctx.lineTo(x+w/2,yy+6);ctx.closePath();ctx.fill();ctx.restore();

 else if(state==='END'&&!pika.defeated)updatePika(dt);}
// ---------- WEJŚCIE ----------
const $=id=>document.getElementById(id);
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{Snd.init();Snd.resume();
 if(state!=='PLAY'||!ball||ball.phase!=='ready')return;
 const p=toGame(e);if(Math.hypot(p.x-POUCH.x,p.y-POUCH.y)>170)return;
 aiming=true;cv.setPointerCapture(e.pointerId);moveAim(p);});
cv.addEventListener('pointermove',e=>{if(aiming)moveAim(toGame(e));});
function moveAim(p){let dx=p.x-POUCH.x,dy=p.y-POUCH.y;const d=Math.hypot(dx,dy)||1;if(d>MAXPULL){dx*=MAXPULL/d;dy*=MAXPULL/d;}ball.x=POUCH.x+dx;ball.y=POUCH.y+dy;}
cv.addEventListener('pointerup',()=>{if(!aiming)return;aiming=false;endAim();});
cv.addEventListener('pointercancel',()=>{aiming=false;});
function endAim(){const px=ball.x-POUCH.x,py=ball.y-POUCH.y;if(Math.hypot(px,py)<14)return;
 ball.vx=-px*K;ball.vy=-py*K;ball.phase='fly';ball.t=0;shotsFired++;ballsLeft--;Snd.whoosh();}
// ---------- EKRANY I MENU ----------
function setStars(el,str){el.textContent=str;el.classList.remove('pop');void el.offsetWidth;if(str)el.classList.add('pop');}
function showEnd(win){if(state!=='PLAY')return;state='END';$('endOvl').classList.add('hidden');$('finalOvl').classList.add('hidden');
 const L=LEVELS[levelIdx];
 if(win){const wasted=shotsFired-L.need,stars=wasted<=1?3:wasted<=3?2:1;totalScore+=score;
  save.stars[levelIdx]=Math.max(save.stars[levelIdx]||0,stars);if(levelIdx+2>save.unlocked)save.unlocked=Math.min(LEVELS.length,levelIdx+2);// tylko w pamięci sesji — bez zapisu trwałego
  const starStr='★'.repeat(stars)+'☆'.repeat(3-stars);
  if(levelIdx===LEVELS.length-1){setStars($('finalStars'),starStr);$('finalScore').innerHTML='Wynik: <b>'+totalScore+'</b>';$('finalOvl').classList.remove('hidden');}
  else{setStars($('endStars'),starStr);$('endTitle').textContent='PIKA ZMIXOWANY ❄️';$('endScore').innerHTML='Wynik levelu: <b>'+score+'</b><br>Suma wyników: '+totalScore;$('btnNext').style.display='';$('endOvl').classList.remove('hidden');}}
 else{Snd.loseTune();const titles=['Pika wrócił do piwnicy ❄','Za mało śniegu!','Pika zaszył sie w korpo'];$('endTitle').textContent=titles[Math.floor(rand(3))];setStars($('endStars'),'');$('endScore').innerHTML='Wynik levelu: <b>'+score+'</b>';$('btnNext').style.display='none';$('endOvl').classList.remove('hidden');}}
function startLevel(i){levelIdx=i;const L=LEVELS[i];score=0;shotsFired=0;ballsLeft=L.balls;winTimer=-1;loseTimer=-1;bannerT=2.4;parts.length=0;texts.length=0;shakeTrauma=0;
 Object.assign(pika,{x:1050,y:GROUND_Y,vx:0,vy:0,dir:-1,phase:rand(3),stunT:0,crouchT:0,ce:1,wa:1,dodgeCd:.8,pauseT:0,hits:0,defeated:false,landed:false,rot:0,kb:null,plan:null,hatLost:false});
 pika.kbNext=Math.max(7,rand(L.kb[0],L.kb[1]));
 headPos={x:pika.x,y:pika.y-96};ball=null;newBall();aiming=false;
 wind=rand(-.4,.4)*L.wind*78;windTarget=wind;windTimer=rand(2,4);gust.on=false;gust.next=rand(5,8);
 buildObs();
 bubble.showing=false;bubble.text='';bubble.nextIn=1.2;
 state='PLAY';$('menu').classList.add('hidden');$('endOvl').classList.add('hidden');$('finalOvl').classList.add('hidden');}
function toMenu(){stopKb();state='MENU';aiming=false;$('endOvl').classList.add('hidden');$('finalOvl').classList.add('hidden');$('menu').classList.remove('hidden');buildMenu();}
function buildMenu(){const box=$('levels');box.innerHTML='';LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className='lv'+(i>=save.unlocked?' locked':'');const st=save.stars[i]||0;b.innerHTML='<span class="num">'+(i+1)+'</span><span class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</span>';if(i<save.unlocked)b.onclick=()=>{Snd.init();Snd.resume();Snd.click();startLevel(i);};box.appendChild(b);});}
$('btnRetry').onclick=()=>{Snd.click();startLevel(levelIdx);};
$('btnMenu1').onclick=()=>{Snd.click();toMenu();};
$('btnNext').onclick=()=>{Snd.click();if(levelIdx<LEVELS.length-1)startLevel(levelIdx+1);else toMenu();};
$('btnFinalMenu').onclick=()=>{Snd.click();toMenu();};
$('btnAgain').onclick=()=>{Snd.click();totalScore=0;startLevel(0);};
$('muteBtn').onclick=()=>{Snd.init();Snd.muted=!Snd.muted;if(Snd.master)Snd.master.gain.value=Snd.muted?0:.5;kbAud.forEach(a=>{if(a)a.volume=Snd.muted?0:.5;});$('muteBtn').textContent=Snd.muted?'🔇':'🔊';};
addEventListener('keydown',e=>{if(e.key==='Escape')toMenu();else if((e.key==='r'||e.key==='R')&&state!=='MENU'){Snd.click();startLevel(levelIdx);}else if(e.key==='m'||e.key==='M')$('muteBtn').click();});
// ---------- START ----------
fit();buildMenu();faceImg.src='pika.png';
function frame(ts){requestAnimationFrame(frame);let dt=(ts-(lastTs||ts-16))/1000;lastTs=ts;if(!(dt>0)||dt>.05)dt=.016;update(dt);render();}
requestAnimationFrame(frame);
</script>
</body>
</html>
